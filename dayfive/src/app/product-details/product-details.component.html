<div class="container mt-5" *ngIf="product; else notFound">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <!-- Product Details Card -->
      <div class="card border-0 shadow-lg" appHighlight="rgba(13, 110, 253, 0.05)">
        <div class="card-header bg-primary text-white text-center py-4">
          <h2 class="h3 mb-0 fw-bold">
            <i class="bi bi-box me-2"></i>
            Product Details
          </h2>
        </div>
        
        <div class="card-body p-5">
          <!-- Product Image Placeholder -->
          <div class="text-center mb-4">
            <div class="bg-light rounded-circle d-inline-flex p-4">
              <i class="bi bi-box display-1 text-primary"></i>
            </div>
          </div>

          <!-- Product Information -->
          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
              <span class="text-muted">Product ID:</span>
              <span class="badge bg-secondary fs-6">#{{ product.id }}</span>
            </div>
            
            <div class="mb-3 pb-2 border-bottom">
              <label class="text-muted d-block mb-2">Product Name:</label>
              <h3 class="h4 fw-bold">{{ product.name }}</h3>
            </div>
            
            <div class="mb-3 pb-2 border-bottom">
              <label class="text-muted d-block mb-2">Price:</label>
              <h2 class="display-6 text-success fw-bold">${{ product.price.toFixed(2) }}</h2>
            </div>
            
            <div class="mb-4">
              <label class="text-muted d-block mb-2">Description:</label>
              <p class="lead">{{ product.description }}</p>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="d-grid gap-2">
            <button routerLink="/about/products" class="btn btn-primary btn-lg py-3">
              <i class="bi bi-arrow-left me-2"></i>
              Back to Products
            </button>
          </div>
        </div>

        <!-- Footer -->
        <div class="card-footer bg-light text-center py-3">
          <small class="text-muted">
            <i class="bi bi-info-circle me-1"></i>
            Detailed view of selected product
          </small>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Not Found Template -->
<ng-template #notFound>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-lg" appHighlight="rgba(220, 53, 69, 0.05)">
          <div class="card-header bg-danger text-white text-center py-4">
            <h2 class="h3 mb-0 fw-bold">
              <i class="bi bi-exclamation-triangle me-2"></i>
              Product Not Found
            </h2>
          </div>
          
          <div class="card-body text-center p-5">
            <div class="mb-4">
              <i class="bi bi-emoji-frown display-1 text-danger"></i>
            </div>
            
            <h3 class="h4 mb-3">Oops! Product not found</h3>
            <p class="text-muted mb-4">
              The product you're looking for doesn't exist or has been removed.
            </p>
            
            <button routerLink="/about/products" class="btn btn-primary btn-lg px-5">
              <i class="bi bi-arrow-left me-2"></i>
              Back to Products
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
